version: '3.8'

services:
  pacific-octopus-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pacific-octopus-ai
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - BROWSER_HEADLESS=true
      - IN_DOCKER=1
      - DISPLAY=:99
      - GROQ_API_KEY=${GROQ_API_KEY:+}
      - GROQ_MODEL=${GROQ_MODEL-llama-3.3-70b-versatile}
    volumes:
      - ./octopus_ai/assets/audio_cache:/app/octopus_ai/assets/audio_cache
      - chrome-data:/app/chrome-data
    working_dir: /app
    ipc: host
    restart: unless-stopped

volumes:
  chrome-data:
    driver: local
